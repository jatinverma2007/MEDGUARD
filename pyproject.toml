[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medguard"
version = "0.1.0"
description = "MedGuard - prescription safety AI: drug extraction, interaction detection, severity grading and bilingual explanations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jatin Verma" }]
keywords = ["medical-ai", "drug-drug-interaction", "nlp", "calibration", "healthcare"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core deps are deliberately light so the repo installs (and CI runs) on CPU
# without pulling torch. Everything heavy lives behind an optional extra.
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1",
  "pyarrow>=15.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "jinja2>=3.1",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2",
  "transformers>=4.44",
  "datasets>=2.20",
  "accelerate>=0.33",
  "peft>=0.12",
  "bitsandbytes>=0.43",
  "sentencepiece>=0.2",
  "pillow>=10.3",
  "qwen-vl-utils==0.0.8",
]
ocr = ["pytesseract>=0.3.10"]
data = ["tdc>=0.4.1"]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "ipython>=8.26",
  "jupyter>=1.0",
]
all = ["medguard[ml,ocr,data,dev]"]

[project.scripts]
medguard = "medguard.cli:app"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/medguard"
Repository = "https://github.com/YOUR_USERNAME/medguard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medguard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N806"]
# B008: typer.Option/typer.Argument in defaults is the intended Typer idiom.
"src/medguard/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
packages = ["medguard"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
